<div class="cont-header">

  <!-- Buscador -->
  <div class="buscador">
    <i class="fa fa-search icon-buscar"></i>
    <input type="text" placeholder="Buscar...">
  </div>

  <!-- Acciones -->
  <div class="acciones-usuario">

    <!-- Campana de notificaciones -->
    <div class="notificacion">
      <i class="fa-regular fa-bell"></i>
      <span class="badge"></span>
    </div>

    <!-- Separador -->
    <div class="separador"></div>

<div class="perfil-info" (click)="irAPerfil()">

  <div class="textos-perfil">
    <span class="nombre-perfil">
      {{ usuarioActual?.data?.nombre || 'Usuario' }}
    </span>

  <span class="rol-perfil">
  {{ rolActual?.rol?.nombre || 'Rol no definido' }}
</span>
  </div>

  <div class="avatar-container">
    <img
      [src]="usuarioActual?.data?.imagenUrl || 'assets/perfil.png'"
      alt="Perfil">
  </div>

</div>

  </div>
</div>

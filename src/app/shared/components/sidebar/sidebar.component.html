<div class="sidebar">

  <!-- HEADER -->
  <div class="sidebar-header">
    <div class="logo-box">
<img
  [src]="ubicacionLogo || '/assets/oti-unsm.png'"
  alt="Ubicación logo"
  class="ubicacion-logo"
/>

<div class="logo-text">
  <p class="title">{{ ubicacionNombre }}</p>
  <p class="subtitle">Panel de gestión</p>
</div>


    </div>
  </div>

  <!-- MENU -->
  <ul class="menu">

    <li *ngFor="let mod of modulos">

      <!-- CON SUBMÓDULOS -->
      <ng-container *ngIf="mod.subModulos?.length; else direct">

        <div
          class="menu-item"
          [class.open]="expanded[mod.id]"
          (click)="onClickModulo(mod)"
        >

          <div class="menu-left">
            <i [class]="mod.icon"></i>
            <span>{{ mod.nombre }}</span>
          </div>

          <i
            class="fas fa-chevron-right arrow"
            (click)="toggle(mod.id); $event.stopPropagation()"
          ></i>

        </div>

        <ul class="submenu" *ngIf="expanded[mod.id]">

          <li *ngFor="let sub of mod.subModulos">
            <a
              class="submenu-item"
              [routerLink]="sub.ruta"
              routerLinkActive="active"
            >
              <i [class]="sub.icon || 'fas fa-circle'"></i>
              {{ sub.nombre }}
            </a>
          </li>

        </ul>

      </ng-container>

      <!-- SIN SUBMÓDULOS (MISMO DISEÑO) -->
      <ng-template #direct>

        <a
          class="menu-item"
          [routerLink]="mod.ruta"
          routerLinkActive="active"
        >

          <div class="menu-left">
            <i [class]="mod.icon || 'fas fa-folder'"></i>
            <span>{{ mod.nombre }}</span>
          </div>

        </a>

      </ng-template>

    </li>

  </ul>

  <!-- FOOTER -->
  <div class="sidebar-footer">

    <button class="logout-btn" (click)="logout()">
      <i class="fa fa-sign-out"></i>
      Cerrar sesión
    </button>

  </div>

</div>

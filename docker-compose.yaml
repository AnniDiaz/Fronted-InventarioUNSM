name: sistema_inventario_oti

services:
  inventario_sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: inventario_sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Debes definir MSSQL_SA_PASSWORD en el .env}
      MSSQL_PID: Express
    ports:
      - "${SQLSERVER_HOST_PORT:-1433}:1433"
    volumes:
      - inventario_sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - inventario_net

  inventario_sqlserver_init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: inventario_sqlserver_init
    depends_on:
      inventario_sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Debes definir MSSQL_SA_PASSWORD en el .env}
      DB_NAME: ${DB_NAME:-Proyecto de practicas}
    volumes:
      - ./sqlserver:/scripts:ro
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        EXISTS=$$(/opt/mssql-tools18/bin/sqlcmd -S inventario_sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C -h -1 -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM sys.databases WHERE name = '$$DB_NAME'" | tr -d '[:space:]')
        if [ "$$EXISTS" = "1" ]; then
          echo "La base de datos '$$DB_NAME' ya existe, no se vuelve a importar."
        else
          echo "Importando script(s) .sql en /scripts ..."
          for f in /scripts/*.sql; do
            echo "-> Ejecutando $$f"
            /opt/mssql-tools18/bin/sqlcmd -S inventario_sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C -i "$$f"
          done
        fi
    networks:
      - inventario_net
    restart: "no"

  inventario_backend:
    build:
      context: ./Inventario-UNSM
    container_name: inventario_backend
    restart: unless-stopped
    depends_on:
      inventario_sqlserver_init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Conexion: "Server=inventario_sqlserver,1433;Database=${DB_NAME:-Proyecto de practicas};User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;"
      Kestrel__Endpoints__Http__Url: http://+:8080
      Kestrel__Endpoints__Https__Url: ""
      Jwt__Key: ${JWT_KEY:-ClaveSuperSecretaDeAlMenos32Caracteres}
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"
    networks:
      - inventario_net

  inventario_frontend:
    build:
      context: ./Fronted-InventarioUNSM
    container_name: inventario_frontend
    restart: unless-stopped
    depends_on:
      - inventario_backend
    ports:
      - "${FRONTEND_HOST_PORT:-4200}:80"
    networks:
      - inventario_net

volumes:
  inventario_sqlserver_data:
    name: inventario_sqlserver_data

networks:
  inventario_net:
    name: inventario_net
    driver: bridge
